<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7C9A92">
<meta name="description" content="Um companheiro gentil para dias difíceis.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Passo a Passo</title>
<style>
:root{
  --bg:#F6F3EE; --card:#FFFFFF; --text:#3B3A40; --muted:#857F8C; --line:#ECE6DF;
  --accent:#7C9A92; --accent-d:#5F7F77; --accent-soft:#E3EDEA;
  --lav:#B8A1D9; --lav-soft:#EFE8F7; --warm:#F3E3D3; --sos:#C9776B;
  --r:18px; --shadow:0 2px 10px rgba(60,50,70,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1D1C21; --card:#28272E; --text:#ECE9F0; --muted:#A39DAB; --line:#37353E;
    --accent:#8FB3A9; --accent-d:#A9CAC1; --accent-soft:#2F3D3A;
    --lav:#B9A4DA; --lav-soft:#35304096; --warm:#3A322B; --sos:#D98B7F;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;
  padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
header h1{font-size:1.45rem;margin:0;font-weight:650}
header p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
main{max-width:560px;margin:0 auto;padding:8px 14px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow);border:1px solid var(--line)}
.card.slim{display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
.card.center{text-align:center}
h2{font-size:1.15rem;margin:0 0 6px} h3{font-size:1.02rem;margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:.85rem} .label{margin:12px 0 6px;font-weight:600;font-size:.9rem}
.row{display:flex;gap:8px;align-items:center} .row.wrap{flex-wrap:wrap} .row.center{justify-content:center;flex-wrap:wrap;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;transition:.15s}
.chip.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.chip.big{font-size:1.6rem;padding:6px 0;flex:1;min-width:0}
.chip.sm{font-size:.82rem;padding:5px 10px}
.moods{justify-content:space-between;margin-top:10px}
.btn{background:var(--accent);color:#fff;border-radius:14px;padding:10px 16px;font-weight:600;text-decoration:none;display:inline-block;text-align:center}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--accent-soft);color:var(--accent-d)}
.btn.sm{padding:7px 12px;font-size:.88rem;border-radius:11px}
.btn.big{font-size:1.1rem;padding:14px 36px;margin-top:8px}
.btn.block{display:block;margin:8px 0}
.link{color:var(--accent-d);text-decoration:underline;padding:4px;font-size:.92rem}
.icon{width:32px;height:32px;border-radius:10px;color:var(--muted)} .icon:hover{background:var(--line)}
.add{display:flex;gap:8px;margin:10px 0}
.add input{flex:1;min-width:0}
input,select{font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--accent)}
.add.sm input{padding:7px 10px;font-size:.9rem}
.banner{border-radius:var(--r);padding:12px 16px;margin:12px 0;background:var(--lav-soft)}
.banner.low{background:var(--warm)}
.grid.care{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.care{border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;font-size:.8rem;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card)}
.care span{font-size:1.5rem;filter:grayscale(.6);opacity:.75;transition:.2s}
.care.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.care.on span{filter:none;opacity:1}
.task{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:var(--bg)}
.task-h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pill{background:var(--accent-soft);color:var(--accent-d);border-radius:999px;padding:2px 9px;font-size:.8rem;font-weight:600;white-space:nowrap}
.steps{list-style:none;padding:0;margin:8px 0}
.steps li{padding:4px 0}
.steps label{display:flex;gap:10px;align-items:center;cursor:pointer}
.steps input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.steps input:checked+span{text-decoration:line-through;color:var(--muted)}
.actions{flex-wrap:wrap;margin-top:6px}
.later{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
details summary{cursor:pointer;font-weight:600}
.empty{text-align:center;padding:8px 0}
.ring{position:relative;width:220px;height:220px;margin:14px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
#clock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.6rem;font-weight:300;font-variant-numeric:tabular-nums}
.tips{margin:0;padding-left:20px} .tips li{margin:4px 0}
.bigNum{font-size:3.2rem;font-weight:300;color:var(--accent-d);line-height:1}
.wins{list-style:none;margin:0;padding:0} .wins li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.wins li:last-child{border:none} .time{color:var(--muted);font-size:.85rem;min-width:44px;padding-top:1px}
.week{display:flex;justify-content:space-between;align-items:flex-end;height:150px;margin:10px 0}
.week .col{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.week .bar{width:60%;max-width:28px;background:var(--lav);border-radius:7px}
.week .n{font-size:.75rem;color:var(--muted);min-height:1em} .week .dn{font-size:.75rem;color:var(--muted)}
.breath{position:relative;height:220px;display:flex;align-items:center;justify-content:center}
.bcircle{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft),var(--lav-soft));border:2px solid var(--accent);transform:scale(.55);transition:transform 4s ease-in-out}
#blabel{position:absolute;font-size:1.15rem;font-weight:500}
.ground{padding-left:20px;margin:0} .ground li{margin:5px 0}
.helps{list-style:none;padding:0;margin:0} .helps li{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.kind{text-align:center;background:var(--lav-soft)} .kind p{font-size:1.08rem;margin:4px 0 6px;font-style:italic}
.sos{border-color:var(--sos)} .sos .btn:not(.ghost){background:var(--sos)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .tabs{display:flex;max-width:560px;width:100%}
nav button{flex:1;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;font-size:.75rem;color:var(--muted);gap:1px}
nav button span{font-size:1.35rem;filter:grayscale(.7);opacity:.7}
nav button.on{color:var(--accent-d);font-weight:600} nav button.on span{filter:none;opacity:1}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;background:rgba(20,15,25,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}
#modal[hidden]{display:none}
#modal .card{max-width:400px;width:100%;text-align:center}
#modal .big{font-size:3rem}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:12px}
</style>
</head>
<body>
<header>
  <div><h1 id="greet"></h1><p id="sub"></p></div>
  <button class="icon" id="gear" data-act="go" data-v="ajustes" aria-label="Ajustes" title="Ajustes">⚙️</button>
</header>
<main id="main"></main>
<nav><div class="tabs">
  <button data-act="go" data-v="hoje"><span>🌱</span>Hoje</button>
  <button data-act="go" data-v="foco"><span>⏱️</span>Foco</button>
  <button data-act="go" data-v="vitorias"><span>💛</span>Vitórias</button>
  <button data-act="go" data-v="cuidar"><span>🫶</span>Cuidar</button>
</div></nav>
<div id="toast"></div>
<div id="modal" hidden></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const KEY = 'passoapasso.v1';
const CARE = [['levantar','🛏️','Saí da cama'],['agua','💧','Bebi água'],['comer','🍽️','Comi algo'],
              ['banho','🚿','Tomei banho'],['remedio','💊','Remédio'],['ar','🌤️','Luz / ar livre']];
const MOODS = ['😞','😔','😐','🙂','😊'];
const ENERGY = {low:['🪫','baixa'], mid:['🔋','média'], high:['⚡','boa']};
const SUGG = ['Separar o material','Abrir o arquivo / caderno','Ler só 1 página','Escrever 1 frase','Fazer por 5 minutos','Responder 1 mensagem'];
const CHEERS = ['Isso conta. 💛','Um passo de cada vez. 🌱','Pequeno também é progresso.','Orgulho de você.',
  'Você fez algo hoje. Isso importa.','Olha você aí, tentando. 💛','Mais um passinho. 🌿','Isso foi gentil com você mesmo(a).'];
const KIND = ['Não precisa dar conta de tudo hoje.','Devagar também é caminhar.','Descansar não é fracassar.',
  'Você não precisa merecer uma pausa.','Num dia difícil, o mínimo já é muito.',
  'Fale com você como falaria com alguém que você ama.','Sentimentos passam, mesmo quando parece que não.',
  'Pedir ajuda é coragem, não fraqueza.','Você não está atrasado(a) na sua própria vida.',
  'Feito é melhor que perfeito.','Hoje pode ser só sobre atravessar o dia. E tudo bem.'];

const key = (d = new Date()) => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick = a => a[Math.floor(Math.random()*a.length)];

function defaults(){ return {tasks:[], days:{}, timer:null, name:'',
  helps:['Ouvir uma música que eu gosto','Tomar um banho quente','Mandar mensagem pra alguém de confiança','Sair 5 minutos pra pegar sol']}; }
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) return Object.assign(defaults(), s); } catch(e){} return defaults(); }
let S = load();
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const day = () => S.days[key()] ||= {mood:null, energy:null, care:{}, wins:[]};

const ui = {view:'hoje', dur:5, focoTask:'', showAll:false, editCheckin:false, laterOpen:false, breathing:false};

/* ---------- helpers ---------- */
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2400); }
function addWin(text, kind){ day().wins.push({t:Date.now(), text, kind}); save(); toast(pick(CHEERS)); }
function removeWin(kind){ const d = day(); d.wins = d.wins.filter(w => w.kind !== kind); save(); }
function modal(html){ const m = $('#modal'); m.innerHTML = `<div class="card">${html}</div>`; m.hidden = false; }
function closeModal(){ $('#modal').hidden = true; }
const fmt = ms => { const s = Math.max(0, Math.ceil(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); };
function dailyKind(){ const n = Math.floor(Date.now()/864e5); return KIND[n % KIND.length]; }

function chime(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523.25, 659.25, 783.99].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i*0.35;
      o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.18, t+0.05); g.gain.exponentialRampToValueAtTime(0.001, t+1.4);
      o.start(t); o.stop(t+1.5);
    });
  } catch(e){}
}
function notify(title, body){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  if (navigator.serviceWorker && navigator.serviceWorker.controller)
    navigator.serviceWorker.ready.then(r => r.showNotification(title, {body, icon:'icon-192.png', badge:'icon-192.png'}));
  else try { new Notification(title, {body, icon:'icon-192.png'}); } catch(e){}
}

/* ---------- views ---------- */
function renderHeader(){
  const h = new Date().getHours();
  const g = h < 5 ? 'Boa noite' : h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  $('#greet').textContent = g + (S.name ? ', ' + S.name : '') + ' 🌿';
  $('#sub').textContent = dailyKind();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === ui.view));
}

function taskCard(t){
  const n = t.steps.length, k = t.steps.filter(s => s.done).length;
  const steps = n
    ? `<ul class="steps">${t.steps.map(s => `<li><label><input type="checkbox" data-act="step" data-id="${t.id}" data-s="${s.id}" ${s.done?'checked':''}><span>${esc(s.text)}</span></label></li>`).join('')}</ul>`
    : `<p class="muted small" style="margin:8px 0 6px">Parece grande? Quebre em passos minúsculos:</p>
       <div class="row wrap">${SUGG.map(x => `<button class="chip sm" data-act="sugg" data-id="${t.id}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>`;
  return `<div class="task">
    <div class="task-h"><strong>${esc(t.title)}</strong>${n ? `<span class="pill">${k}/${n}</span>` : ''}</div>
    ${steps}
    <form data-form="addStep" data-id="${t.id}" class="add sm"><input name="t" placeholder="+ um passo pequeno" maxlength="100" autocomplete="off"></form>
    <div class="row actions">
      <button class="btn sm" data-act="doneTask" data-id="${t.id}">✓ Concluí</button>
      <button class="btn sm ghost" data-act="focusTask" data-id="${t.id}">⏱️ 5 min</button>
      <button class="btn sm ghost" data-act="later" data-id="${t.id}">Depois</button>
      <button class="icon" data-act="delTask" data-id="${t.id}" title="Apagar">✕</button>
    </div></div>`;
}

function viewHoje(){
  const d = day(); let h = '';
  if (d.mood == null || d.energy == null || ui.editCheckin){
    h += `<div class="card"><h2>Como você está agora?</h2>
      <p class="muted small" style="margin:0">Sem resposta certa. É só pra eu te ajudar do jeito certo.</p>
      <div class="row moods">${MOODS.map((m,i) => `<button class="chip big ${d.mood===i+1?'on':''}" data-act="mood" data-v="${i+1}" aria-label="humor ${i+1}">${m}</button>`).join('')}</div>
      <p class="label">Sua energia</p>
      <div class="row wrap">${Object.entries(ENERGY).map(([k,[e,t]]) => `<button class="chip ${d.energy===k?'on':''}" data-act="energy" data-v="${k}">${e} ${t}</button>`).join('')}</div></div>`;
  } else {
    h += `<div class="card slim"><span>Hoje: ${MOODS[d.mood-1]} · energia ${ENERGY[d.energy][1]}</span><button class="link" data-act="editCheckin">mudar</button></div>`;
  }
  if (d.energy === 'low') h += `<div class="banner low">🪫 <b>Dia de energia baixa.</b> Escolha só <b>uma</b> coisa pequena — ou nenhuma. Cuidar de você também é tarefa.</div>`;
  else if (d.energy === 'mid') h += `<div class="banner">Vamos com calma: um passo de cada vez. 🌱</div>`;
  else if (d.energy === 'high') h += `<div class="banner">Que bom! Aproveita — mas sem se cobrar demais. ⚡</div>`;
  if (d.mood && d.mood <= 2) h += `<div class="banner">Tá pesado hoje? <button class="link" data-act="go" data-v="cuidar">Vem respirar um pouco comigo →</button></div>`;

  h += `<div class="card"><h2>Cuidar de mim</h2><p class="muted small" style="margin:0">Cada um desses é uma vitória de verdade.</p>
    <div class="grid care">${CARE.map(([k,e,t]) => `<button class="care ${d.care[k]?'on':''}" data-act="care" data-v="${k}"><span>${e}</span>${t}</button>`).join('')}</div></div>`;

  const today = S.tasks.filter(t => t.today && !t.done), later = S.tasks.filter(t => !t.today && !t.done);
  const lite = d.energy === 'low' && !ui.showAll;
  const shown = lite ? today.slice(0,1) : today;
  h += `<div class="card"><h2>Para hoje</h2>
    <form data-form="addTask" class="add"><input name="t" placeholder="O que você quer tentar fazer?" maxlength="120" autocomplete="off"><button class="btn">+</button></form>
    ${today.length ? '' : '<p class="muted empty">Nada aqui ainda. Tudo bem começar pequeno.</p>'}
    ${shown.map(taskCard).join('')}
    ${lite && today.length > 1 ? `<button class="link" data-act="showAll">mostrar as outras ${today.length-1} (sem pressão)</button>` : ''}
  </div>`;
  if (later.length) h += `<details class="card" id="laterBox" ${ui.laterOpen?'open':''}><summary>Mais tarde (${later.length})</summary>
    ${later.map(t => `<div class="later"><span>${esc(t.title)}</span><span><button class="icon" data-act="toToday" data-id="${t.id}" title="Trazer pra hoje">↑</button><button class="icon" data-act="delTask" data-id="${t.id}" title="Apagar">✕</button></span></div>`).join('')}
    <p class="muted small">Adiar não é falhar. Às vezes é só respeitar seu limite.</p></details>`;
  return h;
}

function viewFoco(){
  const tm = S.timer, running = tm && tm.endAt > Date.now();
  const opts = S.tasks.filter(t => t.today && !t.done);
  let h = `<div class="card center"><h2>Só um pouquinho</h2>
    <p class="muted" style="margin-top:0">Começar é a parte mais difícil. Combina com você: só ${running ? tm.dur : ui.dur} minutos. Se quiser parar depois, pode.</p>`;
  if (!running){
    h += `<select id="focoTask"><option value="">Algo livre</option>${opts.map(t => `<option value="${t.id}" ${ui.focoTask===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}</select>
      <div class="row center">${[5,10,15,25].map(m => `<button class="chip ${ui.dur===m?'on':''}" data-act="dur" data-v="${m}">${m} min</button>`).join('')}</div>`;
  }
  h += `<div class="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle id="ringFg" class="fg" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg>
    <div id="clock">${fmt(running ? tm.endAt - Date.now() : ui.dur*60000)}</div></div>`;
  h += running
    ? `<p class="muted">${tm.label ? esc(tm.label) : 'Foco livre'}</p><button class="btn ghost" data-act="stop">Parar (tudo bem parar)</button>`
    : `<button class="btn big" data-act="start">Começar</button>`;
  h += `</div><div class="card"><h3>Pra ajudar a começar</h3><ul class="tips">
    <li>Deixa o celular longe ou virado pra baixo.</li><li>Começa pela parte mais fácil.</li>
    <li>Feito é melhor que perfeito.</li><li>Água do lado e uma posição confortável.</li></ul></div>`;
  return h;
}

function viewVitorias(){
  const w = day().wins;
  let h = `<div class="card center"><div class="bigNum">${w.length}</div>
    <p>${w.length ? (w.length === 1 ? 'vitória hoje. Ela conta! 💛' : 'vitórias hoje. Cada uma conta. 💛') : 'Nenhuma registrada ainda — e atravessar um dia difícil já é uma.'}</p>
    <form data-form="win" class="add"><input name="t" placeholder="Registrar uma vitória (qualquer uma!)" maxlength="120" autocomplete="off"><button class="btn">+</button></form></div>`;
  if (w.length) h += `<div class="card"><ul class="wins">${[...w].reverse().map(x => `<li><span class="time">${new Date(x.t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span><span>${esc(x.text)}</span></li>`).join('')}</ul></div>`;
  const days = [...Array(7)].map((_, i) => { const dt = new Date(); dt.setDate(dt.getDate() - 6 + i); return dt; });
  const max = Math.max(1, ...days.map(dt => S.days[key(dt)]?.wins.length || 0));
  h += `<div class="card"><h3>Últimos 7 dias</h3><div class="week">${days.map(dt => {
      const dd = S.days[key(dt)], n = dd?.wins.length || 0;
      return `<div class="col"><span class="n">${n || ''}</span><div class="bar" style="height:${Math.round(n/max*90)+4}px"></div><span>${dd?.mood ? MOODS[dd.mood-1] : '·'}</span><span class="dn">${dt.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','').slice(0,3)}</span></div>`;
    }).join('')}</div><p class="muted small">Dias com pouco não são dias perdidos. Oscilar faz parte.</p></div>`;
  return h;
}

function viewCuidar(){
  return `<div class="card center"><h2>Respirar</h2>
    <div class="breath"><div id="bcircle" class="bcircle"></div><div id="blabel">${ui.breathing ? '' : '🌬️'}</div></div>
    <button class="btn" data-act="breath">${ui.breathing ? 'Parar' : 'Começar a respirar'}</button>
    <p class="muted small">Inspira 4s · segura 4s · solta devagar 6s</p></div>
  <div class="card"><h3>Voltar pro agora (5-4-3-2-1)</h3><ol class="ground" style="list-style:none;padding:0">
    <li><b>5</b> coisas que você vê</li><li><b>4</b> coisas que você pode tocar</li><li><b>3</b> sons que você ouve</li>
    <li><b>2</b> cheiros que você sente</li><li><b>1</b> coisa boa sobre você ou sobre agora</li></ol></div>
  <div class="card"><h3>Coisas que me ajudam</h3>
    <ul class="helps">${S.helps.map((x,i) => `<li><span>${esc(x)}</span><button class="icon" data-act="delHelp" data-v="${i}" title="Remover">✕</button></li>`).join('')}</ul>
    <form data-form="help" class="add sm"><input name="t" placeholder="+ algo que te faz bem" maxlength="100" autocomplete="off"></form></div>
  <div class="card kind"><p id="kindMsg">${pick(KIND)}</p><button class="link" data-act="kind">outra mensagem</button></div>
  <div class="card sos"><h3>Precisa conversar com alguém agora?</h3>
    <p style="margin-top:0">Você não precisa passar por isso sem ninguém. Tem gente pronta pra ouvir, sem julgamento.</p>
    <a class="btn block" href="tel:188">📞 CVV — ligar 188 (24h, grátis)</a>
    <a class="btn block ghost" href="https://cvv.org.br/chat/" target="_blank" rel="noopener">💬 Conversar por chat com o CVV</a>
    <a class="btn block ghost" href="tel:192">🚑 SAMU — 192 (emergência)</a>
    <p class="muted small">Se puder, procure também acompanhamento com psicólogo(a) ou psiquiatra. Pelo SUS, a UBS ou o CAPS perto de você atendem de graça.</p></div>`;
}

function viewAjustes(){
  return `<div class="card"><h2>Ajustes</h2>
    <p class="label">Como posso te chamar?</p>
    <form data-form="name" class="add"><input name="t" value="${esc(S.name)}" placeholder="Seu nome ou apelido" maxlength="30"><button class="btn">Salvar</button></form></div>
  <div class="card"><h3>Seus dados</h3>
    <p class="muted small">Tudo fica guardado só neste aparelho. Nada é enviado pra internet.</p>
    <p class="muted small">Pra levar seus dados do PC pro celular (ou o contrário): exporte aqui e importe no outro aparelho.</p>
    <div class="stack">
      <button class="btn ghost" data-act="export">⬇️ Exportar backup</button>
      <label class="btn ghost" style="cursor:pointer">⬆️ Importar backup<input type="file" id="importFile" accept="application/json,.json" hidden></label>
      <button class="link" data-act="reset" style="color:var(--sos)">Apagar todos os dados</button>
    </div></div>
  <div class="card"><h3>Instalar como app</h3>
    <p class="muted small" style="margin:0"><b>Celular (Chrome):</b> menu ⋮ → <i>Adicionar à tela inicial</i> / <i>Instalar app</i>.<br>
    <b>PC (Chrome/Edge):</b> ícone de instalar na barra de endereço, ou menu → <i>Instalar Passo a Passo</i>.</p>
    ${deferredInstall ? '<button class="btn" data-act="install" style="margin-top:10px">Instalar agora</button>' : ''}</div>
  <button class="link" data-act="go" data-v="hoje">← voltar</button>`;
}

const VIEWS = {hoje:viewHoje, foco:viewFoco, vitorias:viewVitorias, cuidar:viewCuidar, ajustes:viewAjustes};
function render(){
  renderHeader();
  $('#main').innerHTML = VIEWS[ui.view]();
  if (ui.view === 'foco') tick();
}
function go(v){ if (ui.breathing){ ui.breathing = false; clearTimeout(bT); } ui.view = v; render(); window.scrollTo(0,0); }

/* ---------- timer ---------- */
function tick(){
  const tm = S.timer; if (!tm) return;
  const left = tm.endAt - Date.now();
  if (left <= 0) return finishTimer();
  if (ui.view === 'foco'){
    const c = $('#clock'), r = $('#ringFg');
    if (c) c.textContent = fmt(left);
    if (r) r.setAttribute('stroke-dashoffset', String(326.7 * (1 - left / (tm.dur*60000))));
  }
  document.title = fmt(left) + ' · Passo a Passo';
}
setInterval(tick, 1000);

function finishTimer(){
  const tm = S.timer; S.timer = null; save(); document.title = 'Passo a Passo';
  addWin(`Foquei ${tm.dur} min${tm.label ? ' em ' + tm.label : ''}`, 'focus');
  chime(); notify('Você conseguiu! 🌱', `${tm.dur} minutos de foco. Hora de respirar.`);
  ui.focoTask = tm.taskId || '';
  modal(`<div class="big">🌱</div><h2>Você conseguiu!</h2><p>${tm.dur} minutos. Quer continuar mais um pouco ou parar por agora?<br><b>Os dois estão ótimos.</b></p>
    <div class="stack"><button class="btn" data-act="more">Mais 5 minutos</button><button class="btn ghost" data-act="closeModal">Parar por agora</button></div>`);
  render();
}
function startTimer(dur){
  const t = S.tasks.find(x => x.id === ui.focoTask);
  S.timer = {endAt: Date.now() + dur*60000, dur, label: t ? t.title : '', taskId: t ? t.id : ''};
  save();
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  render();
}

/* ---------- breathing ---------- */
let bT = null;
function breathStep(i){
  const P = [['Inspira…',4000,1],['Segura…',4000,1],['Solta devagar…',6000,.55]];
  const [txt, ms, sc] = P[i % 3], c = $('#bcircle'), l = $('#blabel');
  if (!c || !ui.breathing) return;
  c.style.transitionDuration = (i % 3 === 1 ? 0 : ms) + 'ms';
  c.style.transform = `scale(${sc})`; l.textContent = txt;
  bT = setTimeout(() => breathStep(i+1), ms);
}

/* ---------- events ---------- */
const findTask = id => S.tasks.find(t => t.id === id);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const {act, v, id, s} = el.dataset, d = day();
  switch (act){
    case 'go': go(v); break;
    case 'mood': d.mood = +v; if (d.energy) ui.editCheckin = false; save(); render(); break;
    case 'energy': d.energy = v; if (d.mood) ui.editCheckin = false; ui.showAll = false; save(); render(); break;
    case 'editCheckin': ui.editCheckin = true; render(); break;
    case 'care': {
      const item = CARE.find(c => c[0] === v);
      if (d.care[v]){ delete d.care[v]; removeWin('care:' + v); }
      else { d.care[v] = true; addWin(item[1] + ' ' + item[2], 'care:' + v); }
      save(); render(); break;
    }
    case 'step': {
      const t = findTask(id), st = t && t.steps.find(x => x.id === s); if (!st) break;
      st.done = el.checked;
      if (st.done){ addWin('Passo: ' + st.text, 'step:' + st.id);
        if (t.steps.every(x => x.done)) setTimeout(() => toast('Todos os passos feitos! Pode marcar como concluída 🎉'), 2500); }
      else removeWin('step:' + st.id);
      save(); render(); break;
    }
    case 'sugg': { const t = findTask(id); if (t){ t.steps.push({id:uid(), text:v, done:false}); save(); render(); } break; }
    case 'doneTask': { const t = findTask(id); if (t){ t.done = true; t.doneAt = Date.now(); addWin('Concluí: ' + t.title, 'task:' + t.id); render(); } break; }
    case 'later': { const t = findTask(id); if (t){ t.today = false; save(); toast('Guardado pra depois. Sem culpa. 🌿'); render(); } break; }
    case 'toToday': { const t = findTask(id); if (t){ t.today = true; save(); render(); } break; }
    case 'delTask': if (confirm('Apagar essa tarefa?')){ S.tasks = S.tasks.filter(t => t.id !== id); save(); render(); } break;
    case 'focusTask': ui.focoTask = id; ui.dur = 5; go('foco'); break;
    case 'showAll': ui.showAll = true; render(); break;
    case 'dur': ui.dur = +v; render(); break;
    case 'start': startTimer(ui.dur); break;
    case 'more': closeModal(); startTimer(5); break;
    case 'closeModal': closeModal(); break;
    case 'stop': {
      const tm = S.timer, mins = Math.floor((Date.now() - (tm.endAt - tm.dur*60000)) / 60000);
      S.timer = null; save(); document.title = 'Passo a Passo';
      if (mins >= 1) addWin(`Foquei ${mins} min${tm.label ? ' em ' + tm.label : ''}`, 'focus');
      else toast('Você tentou, e isso já conta. 💛');
      render(); break;
    }
    case 'breath':
      ui.breathing = !ui.breathing; clearTimeout(bT); render();
      if (ui.breathing) setTimeout(() => breathStep(0), 50);
      break;
    case 'kind': $('#kindMsg').textContent = pick(KIND); break;
    case 'delHelp': S.helps.splice(+v, 1); save(); render(); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `passo-a-passo-backup-${key()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      break;
    }
    case 'reset':
      if (confirm('Apagar TODOS os dados deste aparelho? Isso não pode ser desfeito.') && confirm('Tem certeza mesmo?')){
        S = defaults(); save(); go('hoje'); }
      break;
    case 'install': if (deferredInstall){ deferredInstall.prompt(); deferredInstall = null; } break;
  }
});

document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  const val = (f.elements.t.value || '').trim();
  switch (f.dataset.form){
    case 'addTask': if (val){ S.tasks.push({id:uid(), title:val, today:true, steps:[], done:false}); save(); render(); $('[data-form=addTask] input')?.focus(); } break;
    case 'addStep': { const t = findTask(f.dataset.id); if (t && val){ t.steps.push({id:uid(), text:val, done:false}); save(); render();
        $(`[data-form=addStep][data-id="${t.id}"] input`)?.focus(); } break; }
    case 'win': if (val){ addWin(val, 'manual'); render(); } break;
    case 'help': if (val){ S.helps.push(val); save(); render(); } break;
    case 'name': S.name = val; save(); toast(val ? `Oi, ${val}! 💛` : 'Ok!'); render(); break;
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'focoTask') ui.focoTask = e.target.value;
  if (e.target.id === 'importFile' && e.target.files[0]){
    const r = new FileReader();
    r.onload = () => {
      try { const data = JSON.parse(r.result); if (!data || !Array.isArray(data.tasks) || typeof data.days !== 'object') throw 0;
        if (confirm('Substituir os dados deste aparelho pelo backup?')){ S = Object.assign(defaults(), data); save(); toast('Backup importado! 🌱'); go('hoje'); }
      } catch(err){ alert('Esse arquivo não parece um backup do Passo a Passo.'); }
    };
    r.readAsText(e.target.files[0]);
  }
});
document.addEventListener('toggle', e => { if (e.target.id === 'laterBox') ui.laterOpen = e.target.open; }, true);
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

/* re-render when the day changes or the app comes back to the front */
let lastDay = key();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (key() !== lastDay){ lastDay = key(); ui.editCheckin = false; ui.showAll = false; }
  tick(); render();
});

/* ---------- PWA ---------- */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (ui.view === 'ajustes') render(); });
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});

render();
</script>
</body>
</html>
